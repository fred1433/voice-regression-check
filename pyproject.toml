[project]
name = "voice-regression-check"
version = "0.1.0"
description = "Reproducible voice regression check: compare two voice-agent configurations on the same scenarios from Pipecat latency logs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-2-Clause" }
dependencies = ["pyyaml>=6.0"]

[project.scripts]
voice-check = "voice_check.cli:main"

[project.optional-dependencies]
capture = [
    "pipecat-ai[kokoro,whisper,mlx-whisper,silero,openai]==1.15.0",
]
livekit = [
    "livekit-agents==1.8.11",
]

[dependency-groups]
dev = ["pytest>=8", "pipecat-ai==1.15.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
